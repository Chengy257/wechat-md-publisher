[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-md-publisher"
version = "0.1.0"
description = "Render Markdown articles into WeChat Official Account draft HTML."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "cssutils>=2.9",
  "markdown-it-py>=3.0",
  "premailer>=3.10",
  "Pygments>=2.13",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "Pillow>=10.0",
  "pytest>=8.0",
  "responses>=0.25",
  "ruff>=0.6",
]
cover-compress = [
  "Pillow>=10.0",
]

[project.scripts]
wechat-publish = "wechat_publish.cli:main"

[tool.setuptools.packages.find]
include = ["wechat_publish*"]

[tool.setuptools.package-data]
wechat_publish = ["themes/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 (line length) is advisory here; long f-strings/print layouts are kept
ignore = ["E501"]

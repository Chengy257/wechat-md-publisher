name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check wechat_publish tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  package-smoke:
    name: Package smoke (clean wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Install wheel
        run: pip install dist/*.whl
      - name: CLI help
        run: wechat-publish --help
      - name: Render smoke test
        run: |
          mkdir -p /tmp/smoke
          printf '# Smoke Test\n\nHello.\n' > /tmp/smoke/article.md
          cd /tmp/smoke
          wechat-publish render --md article.md
          test -f build/article.preview.html
          test -f build/article.wechat.html
